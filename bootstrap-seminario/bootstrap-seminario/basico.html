<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bootstrap via CDN – exemplo mínimo</title>
  <!-- CSS padrão do Bootstrap, sem build e sem Sass -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container py-4">
    <h1 class="h3 mb-4">Exemplo mínimo via CDN</h1>

    <!-- Grid -->
    <div class="row g-3 mb-4">
      <div class="col-12 col-md-6 col-lg-4"><div class="p-3 bg-primary-subtle rounded">Coluna A</div></div>
      <div class="col-12 col-md-6 col-lg-4"><div class="p-3 bg-primary-subtle rounded">Coluna B</div></div>
      <div class="col-12 col-md-12 col-lg-4"><div class="p-3 bg-primary-subtle rounded">Coluna C</div></div>
    </div>

    <!-- Componente interativo apenas com atributos data-bs-* -->
    <button class="btn btn-primary" type="button"
            data-bs-toggle="collapse" data-bs-target="#detalhes"
            aria-expanded="false" aria-controls="detalhes">
      Mostrar detalhes
    </button>
    <div class="collapse" id="detalhes">
      <div class="card card-body mt-2">Conteúdo exibido ou ocultado.</div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
