<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Exemplo 1 – Atributos data-bs</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-body-tertiary">
<main class="container py-5">
  <h1 class="h3 mb-1">Atributos data-bs</h1>
  <p class="text-secondary mb-4">Comportamento declarativo: nenhum JavaScript.</p>

  <div class="d-flex flex-wrap gap-2 mb-4">
    <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modalExemplo">
      Abrir modal
    </button>

    <button class="btn btn-outline-primary" data-bs-toggle="offcanvas" data-bs-target="#menuLateral">
      Abrir menu lateral
    </button>

    <!--precisa de 1 linha de script-->
    <button class="btn btn-outline-secondary" data-bs-toggle="tooltip"
            data-bs-placement="top" data-bs-title="Dica criada via data-bs-title">
      Passe o mouse
    </button>
  </div>

  <button class="btn btn-link px-0" data-bs-toggle="collapse" data-bs-target="#detalhes"
          aria-expanded="false" aria-controls="detalhes">
    Mostrar/ocultar explicação
  </button>
  <div class="collapse" id="detalhes">
    <div class="card card-body">
      <code>data-bs-toggle</code> escolhe o componente; <code>data-bs-target</code> aponta
      para o elemento afetado; <code>data-bs-dismiss</code> fecha.
    </div>
  </div>
</main>

<div class="modal fade" id="modalExemplo" tabindex="-1" aria-labelledby="tituloModal" aria-hidden="true">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h2 class="modal-title fs-5" id="tituloModal">Confirmar ação</h2>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
      </div>
      <div class="modal-body">Este modal foi aberto e será fechado apenas com atributos <code>data-bs-*</code>.</div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button type="button" class="btn btn-primary" data-bs-dismiss="modal">Confirmar</button>
      </div>
    </div>
  </div>
</div>


<div class="offcanvas offcanvas-start" tabindex="-1" id="menuLateral" aria-labelledby="tituloMenu">
  <div class="offcanvas-header">
    <h2 class="offcanvas-title fs-5" id="tituloMenu">Menu</h2>
    <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Fechar"></button>
  </div>
  <div class="offcanvas-body">
    <div class="list-group">
      <a href="#" class="list-group-item list-group-item-action">Início</a>
      <a href="#" class="list-group-item list-group-item-action">Sobre</a>
      <a href="#" class="list-group-item list-group-item-action">Contato</a>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
