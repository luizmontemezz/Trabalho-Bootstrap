<!DOCTYPE html>
<html lang="pt-BR" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Exemplo 3 – Formulário, Notificação e Tema</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<main class="container py-5" style="max-width: 560px;">
  <div class="d-flex justify-content-between align-items-center mb-4">
    <h1 class="h3 mb-0">Cadastro</h1>

    <button id="botaoTema" class="btn btn-outline-secondary btn-sm">Modo escuro</button>
  </div>


  <form id="formulario" class="needs-validation" novalidate>
    <div class="mb-3">
      <label for="nome" class="form-label">Nome</label>
      <input type="text" class="form-control" id="nome" required minlength="3">
      <div class="invalid-feedback">Informe um nome com pelo menos 3 letras.</div>
    </div>
    <div class="mb-3">
      <label for="email" class="form-label">E-mail</label>
      <input type="email" class="form-control" id="email" required>
      <div class="invalid-feedback">Informe um e-mail válido.</div>
    </div>
    <div class="mb-3">
      <label for="curso" class="form-label">Curso</label>
      <select class="form-select" id="curso" required>
        <option value="" selected disabled>Selecione…</option>
        <option>Informática</option>
        <option>Eletrônica</option>
      </select>
      <div class="invalid-feedback">Escolha um curso.</div>
    </div>
    <div class="form-check mb-4">
      <input class="form-check-input" type="checkbox" id="termos" required>
      <label class="form-check-label" for="termos">Aceito os termos de uso</label>
      <div class="invalid-feedback">É necessário aceitar os termos.</div>
    </div>
    <button type="submit" class="btn btn-primary w-100">Cadastrar</button>
  </form>
</main>


<div class="toast-container position-fixed bottom-0 end-0 p-3">
  <div id="notificacaoSucesso" class="toast text-bg-success" role="status" aria-live="polite" aria-atomic="true">
    <div class="d-flex">
      <div class="toast-body">Cadastro enviado com sucesso.</div>
      <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Fechar"></button>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
  const formulario = document.getElementById('formulario');

  formulario.addEventListener('submit', evento => {
    evento.preventDefault();
    if (formulario.checkValidity()) {
      bootstrap.Toast.getOrCreateInstance(document.getElementById('notificacaoSucesso')).show();
      formulario.reset();
      formulario.classList.remove('was-validated');
    } else {
      formulario.classList.add('was-validated'); 
    }
  });

  document.getElementById('botaoTema').addEventListener('click', evento => {
    const raiz = document.documentElement;
    const escuro = raiz.getAttribute('data-bs-theme') === 'dark';
    raiz.setAttribute('data-bs-theme', escuro ? 'light' : 'dark');
    evento.target.textContent = escuro ? 'Modo escuro' : 'Modo claro';
  });
</script>
</body>
</html>
